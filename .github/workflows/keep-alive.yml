name: Supabase Keep-Alive

# Free Plan pausiert das Projekt nach 7 Tagen ohne Aktivitaet.
# Dieser Job fragt alle 3 Tage einmal die DB ab, damit das nicht passiert.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$URL/rest/v1/baustellen?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null -w "HTTP %{http_code}\n"
