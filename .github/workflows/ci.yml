name: CI

# Laeuft bei jedem Push und Pull Request. Bricht ab, bevor kaputter Code
# nach main (und damit ueber Vercel live) gelangt: Lint + Tests + Build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Job-weit statt nur im Build-Schritt: src/lib/supabase.js validiert die
    # Env-Vars beim Module-Load, und die Tests importieren das Modul indirekt
    # (z.B. via errorLog.js) — ohne Env schlagen also auch die Tests fehl.
    # Es ist der oeffentliche anon-Key + die Projekt-URL (kein Geheimnis,
    # steckt ohnehin im Browser-Bundle) — trotzdem als Secret gepflegt.
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
